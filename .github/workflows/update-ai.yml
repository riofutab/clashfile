name: 更新 AI 规则聚合 (AIAuto.list)

on:
  schedule:
    - cron: '30 19 * * *'   # 每天 UTC 19:30 ≈ 北京 03:30
  workflow_dispatch:          # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 拉取并合并上游 AI 规则
        run: |
          set -uo pipefail
          # 上游权威源（单个拉取失败自动跳过，不影响其余内容）
          SOURCES=(
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list"
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list"
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Anthropic/Anthropic.list"
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list"
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Copilot/Copilot.list"
            "https://raw.githubusercontent.com/cmliu/ACL4SSR/refs/heads/main/Clash/ai.list"
          )
          # 手工种子（保留你精选/优先的域名）
          SEEDS=(OpenAI.list Claude.list Anthropic.list Gemini.list Copilot.list Perplexity.list Grok.list MetaAI.list)

          tmp="$(mktemp)"
          for f in "${SEEDS[@]}"; do [ -f "$f" ] && cat "$f" >> "$tmp"; done
          for url in "${SOURCES[@]}"; do
            if curl -fsSL --max-time 30 "$url" >> "$tmp"; then
              echo "✓ $url"
            else
              echo "✗ 跳过(拉取失败): $url"
            fi
          done

          # 只保留规则行，行尾去空白，去重排序
          {
            echo "# AIAuto.list —— 自动聚合(手工种子 + 上游权威源)，由 update-ai.yml 每日刷新，请勿手改"
            echo "# 来源: 本库手工 AI 文件 + blackmatrix7 + cmliu/ACL4SSR"
            grep -E '^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|IP-CIDR|IP-CIDR6|PROCESS-NAME|URL-REGEX|USER-AGENT),' "$tmp" \
              | sed 's/[[:space:]]*$//' | sort -u
          } > AIAuto.list
          rm -f "$tmp"
          echo "生成 AIAuto.list: $(grep -cE '^[A-Z]' AIAuto.list) 条规则"

      - name: 提交变更（仅在有变化时）
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          if git diff --quiet AIAuto.list; then
            echo "无变化，跳过提交"
          else
            git add AIAuto.list
            git commit -m "chore: 自动更新 AI 规则聚合 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
