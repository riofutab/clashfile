#======================================================================
# GeneralClashConfig.yml  —  subconverter 专用 clash_rule_base
# DNS 方案：redir-host(真实解析，邮箱/内网/App全兼容) + TUN dns-hijack(不泄露)
#   内网域名 → 内网 DNS；国内 → 国内 DoH；境外 → 境外 DoH。
#======================================================================
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090

unified-delay: true
tcp-concurrent: true
find-process-mode: strict
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip-lite.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country-lite.mmdb"

profile:
  store-selected: true
  store-fake-ip: false        # 已不用 fake-ip，关掉缓存避免旧假 IP 残留

# TUN：dns-hijack 把全系统 DNS 收进 Clash → 不泄露；strict-route 关，避免误伤直连/内网
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true
  strict-route: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:53
  enhanced-mode: redir-host    # ★真实解析：邮箱/内网/各类App全兼容
  use-hosts: true
  respect-rules: true          # ★DNS查询纳入路由：境外DoH走节点(墙内才连得上)、国内DoH直连
  default-nameserver:          # 引导：解析下面 DoH 域名本身，必须纯 IP（仅用于bootstrap，不会出现在泄露测试里）
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:     # 解析代理节点自身域名（直连可达，仅bootstrap，不会出现在测试里）
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'
  nameserver:                  # ★所有域名解析全部走【境外】DoH（经节点出去）→ 测试里只剩境外解析器
    - 'https://cloudflare-dns.com/dns-query'
    - 'https://dns.google/dns-query'
  nameserver-policy:
    # 只有内网域名走内网 DNS（私网地址，不会出现在公网泄露测试里）
    '+.teamway.com':
      - '10.0.60.4'
