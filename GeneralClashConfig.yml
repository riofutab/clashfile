#======================================================================
# GeneralClashConfig.yml  —  subconverter 专用 clash_rule_base
# 通用设置 + 分流 DNS + TUN(防泄露)。proxies/proxy-groups/rules 由 subconverter 注入。
# DNS：国内默认(墙内最稳) + 境外域名走境外DNS(防污染) + CN走国内DNS。
#======================================================================
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090

unified-delay: true
tcp-concurrent: true
find-process-mode: strict
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip-lite.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country-lite.mmdb"

profile:
  store-selected: true
  store-fake-ip: true

# TUN：dns-hijack 负责防 DNS 泄露；strict-route 关闭，避免直连/国内站点被误收进 TUN
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true
  strict-route: false

dns:
  enable: true
  ipv6: false                   # 关掉 DNS 的 IPv6，避免国内站点因 AAAA 解析异常打不开
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - 'localhost.ptlogin2.qq.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'time.*.com'
    - 'time.*.gov'
    - 'ntp.*.com'
    - '+.market.xiaomi.com'
    - '+.qq.com'
    - '+.wechat.com'
  default-nameserver:           # 引导：解析 DoH 域名本身，必须纯 IP
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:      # 解析代理节点自身域名，用国内 DNS
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'
  nameserver:                   # ★默认：国内 DNS（墙内最稳，不依赖境外可达性）
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'
  nameserver-policy:
    'geosite:cn,private':       # 国内 / 内网域名 → 国内 DNS
      - 'https://dns.alidns.com/dns-query'
      - 'https://doh.pub/dns-query'
    'geosite:geolocation-!cn':  # ★境外域名 → 境外加密 DNS（防污染）
      - 'https://cloudflare-dns.com/dns-query'
      - 'https://dns.google/dns-query'
