#======================================================================
# GeneralClashConfig.yml  —  subconverter 专用 clash_rule_base
# DNS 方案：redir-host(真实解析，邮箱/内网/App全兼容) + TUN dns-hijack(不泄露)
#   内网域名 → 内网 DNS；国内 → 国内 DoH；境外 → 境外 DoH。
#======================================================================
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090

unified-delay: true
tcp-concurrent: true
find-process-mode: strict
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip-lite.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country-lite.mmdb"

profile:
  store-selected: true
  store-fake-ip: false        # 已不用 fake-ip，关掉缓存避免旧假 IP 残留

# TUN：dns-hijack 把全系统 DNS 收进 Clash → 不泄露；strict-route 关，避免误伤直连/内网
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true
  strict-route: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:53
  enhanced-mode: redir-host    # ★真实解析：邮箱/内网/各类App全兼容
  use-hosts: true
  respect-rules: true          # ★DNS查询纳入路由：境外DoH走节点(墙内才连得上)、国内DoH直连
  default-nameserver:          # 引导：解析下面 DoH 域名本身，必须纯 IP
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:     # 解析代理节点自身域名
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'
  direct-nameserver:           # 直连域名解析（国内 DoH，快）
    - 'https://dns.alidns.com/dns-query'
    - 'https://doh.pub/dns-query'
  nameserver:                  # 默认：国内 DoH（墙内最稳）
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'
  nameserver-policy:
    # ★内网域名 → 内网 DNS（10.0.60.4 须直连可达：在公司网或挂上内网VPN）
    '+.teamway.com':
      - '10.0.60.4'
    # 国内 / 内网网段域名 → 国内 DoH
    'geosite:cn,private':
      - 'https://dns.alidns.com/dns-query'
      - 'https://doh.pub/dns-query'
    # 境外域名 → 境外 DoH（防污染）
    'geosite:geolocation-!cn':
      - 'https://cloudflare-dns.com/dns-query'
      - 'https://dns.google/dns-query'
